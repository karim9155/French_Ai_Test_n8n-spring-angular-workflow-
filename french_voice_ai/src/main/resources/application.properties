# Local settings: .env in this folder or at the repo root (both git-ignored). Real environment variables take precedence.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/frenchdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
# Production URL of the n8n Webhook node that starts the evaluation workflow.
# Set N8N_WEBHOOK_URL (see .env.example); never commit the real URL.
n8n.webhook.url=${N8N_WEBHOOK_URL}
